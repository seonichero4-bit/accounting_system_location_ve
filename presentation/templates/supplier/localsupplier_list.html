<h1>Lista de Proveedores</h1>
<a href="{% url 'supplier-create' %}">Añadir Nuevo Proveedor</a>

<ul>
    {% for supplier in suppliers %}
        <li>
            <a href="{% url 'supplier-detail' supplier.code %}">
                {{ supplier.name }} ({{ supplier.code }})
            </a>
        </li>
    {% empty %}
        <li>No hay proveedores registrados para este perfil fiscal.</li>
    {% endfor %}
</ul>

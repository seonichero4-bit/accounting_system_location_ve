<h1>Eliminar Proveedor</h1>
<p>¿Estás seguro de que deseas eliminar al proveedor "{{ object.name }}" con el código de control "{{ object.code }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'supplier-detail' object.pk %}">Cancelar</a>
</form>

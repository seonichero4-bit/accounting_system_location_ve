<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Cliente</title>
</head>
<body>
    <h1>Eliminar Cliente</h1>
    <p>¿Está seguro de que desea eliminar al cliente <strong>{{ object.name }}</strong> (RIF: {{ object.rif }})?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'customer_list' %}">Cancelar</a>
    </form>
</body>
</html>

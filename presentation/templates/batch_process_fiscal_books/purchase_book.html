<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Procesamiento Fiscal en Lote</title>
    <!-- Agrega aquí tus estilos (ej. Bootstrap) -->
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        .alert { padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error, .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn-process { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Procesamiento en Lote del Libro de Compras</h1>
    <p>Presiona el botón para contabilizar las facturas preliminares del período actual.</p>

    <!-- Sección de Mensajes (Éxito / Errores de Validación) -->
    {% if messages %}
        <div class="messages-container">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Formulario para disparar el método POST -->
    <form method="POST" action="{% url 'fiscal-batch-process' %}">
        {% csrf_token %}
        <button type="submit" class="btn-process">Ejecutar Procesamiento</button>
    </form>

</body>
</html>

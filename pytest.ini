[pytest]
pythonpath = .
# Configuración del módulo de settings para la integración con Django
DJANGO_SETTINGS_MODULE = accounting_system_ve.settings

# Patrones de búsqueda para el descubrimiento automático de pruebas
python_files = test_*.py *_tests.py

# Opciones por defecto al ejecutar pytest: 
# -v: Modo verboso para mejor legibilidad.
# --reuse-db: Reutiliza la base de datos de pruebas entre ejecuciones para mayor velocidad.
# --create-db: Borra la base de datos (guardada por --reuse-db), crea una nueva con su respectivas migraciones.
# --strict-markers: Evita advertencias exigiendo que todos los markers estén registrados.
addopts = -v --strict-markers --reuse-db

# Registro explícito de marcadores personalizados para clasificar la suite de pruebas
markers =
    unit: Pruebas unitarias aisladas (lógica de negocio o validaciones sin base de datos).
    integration: Pruebas de integración interactuando con PostgreSQL o componentes externos.